name: Desktop Builds Only

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run tests only (no build)'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main, develop, staging ]
    paths: [ '**/*.rs', '**/Cargo.toml', '**/Cargo.lock' ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1

jobs:
  # Quick change detection
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'

  # Full test suite
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install -y -qq libudev-dev libsystemd-dev

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Compile check
        run: cargo check --workspace --all-targets --message-format=short

      - name: Unit tests
        run: cargo test -p uncore --lib -- --skip ghost_setfinder --test-threads=4

      - name: Integration tests
        run: cargo test --test integration_tests -- --test-threads=4

  # Desktop platform builds
  desktop-builds:
    name: Desktop Builds
    needs: [changes, full-test]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install -y -qq libudev-dev libsystemd-dev

      - name: Build release
        if: ${{ !inputs.test_mode }}
        run: cargo build --release --bin unhaunter_game --message-format=short

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux' && !inputs.test_mode
        uses: actions/upload-artifact@v4
        with:
          name: unhaunter-linux-desktop
          path: target/release/unhaunter_game

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows' && !inputs.test_mode
        uses: actions/upload-artifact@v4
        with:
          name: unhaunter-windows-desktop
          path: target/release/unhaunter_game.exe

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos' && !inputs.test_mode
        uses: actions/upload-artifact@v4
        with:
          name: unhaunter-macos-desktop
          path: target/release/unhaunter_game
