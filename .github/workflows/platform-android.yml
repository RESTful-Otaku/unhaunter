name: Platform - Android

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run tests only (no build)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install -y -qq libudev-dev libsystemd-dev

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk-version: 25.1.8937393

      - name: Cache Android tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-android-tools-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-tools-

      - name: Install cargo-apk
        run: |
          if ! command -v cargo-apk &> /dev/null; then
            cargo install cargo-apk
          else
            echo "cargo-apk already installed"
          fi

      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Compile check
        run: cargo check --workspace --all-targets --message-format=short

      - name: Unit tests
        if: ${{ !inputs.test_mode }}
        run: cargo test -p uncore --lib -- --skip ghost_setfinder --test-threads=4

      - name: Integration tests
        if: ${{ !inputs.test_mode }}
        run: cargo test --test integration_tests -- --test-threads=4

      - name: Build Android APK
        if: ${{ !inputs.test_mode }}
        run: |
          set -e
          echo "Building Android APK..."
          cargo apk build --release --bin unhaunter_game
          echo "Android build completed successfully"

      - name: Upload artifacts
        if: ${{ !inputs.test_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: unhaunter-android
          path: target/android-artifacts/
