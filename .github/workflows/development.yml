name: Development

on:
  push:
    branches:
      - 'feat/*'
      - 'fix/*'
      - 'cont/*'
      - 'perf/*'
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1

jobs:
  # Phase 1: Setup and Dependencies
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup job
        run: echo "Setting up the development environment"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update APT
        run: sudo apt-get update

      - name: Install Linux Dependencies
        run: |
          sudo apt-get install -y build-essential
          sudo apt-get install -y libasound2-dev pkg-config
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install -y libudev-dev libsystemd-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Install Just
        run: cargo install just

  # Phase 2: Code Quality (runs in parallel with setup)
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Phase 3: Compilation and Testing (depends on setup)
  compile-test:
    name: Compile and Test
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install -y -qq libudev-dev libsystemd-dev

      - name: Compile check
        run: cargo check --workspace --all-targets --message-format=short

      - name: Unit tests
        run: cargo test -p uncore --lib -- --skip ghost_setfinder --test-threads=4

  # Phase 4: Summary (depends on all previous phases)
  summary:
    name: Development Summary
    needs: [setup, code-quality, compile-test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Development workflow completed"
          echo "Setup: ${{ needs.setup.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Compile & Test: ${{ needs.compile-test.result }}"
