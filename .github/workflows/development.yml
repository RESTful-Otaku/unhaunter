name: Development

on:
  push:
    branches:
      - 'feat/*'
      - 'fix/*'
      - 'cont/*'
      - 'perf/*'
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup job
        run: echo "Setting up the development job environment"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update APT
        run: sudo apt-get update

      - name: Install Linux Dependencies
        run: |
          sudo apt-get install -y build-essential
          sudo apt-get install -y libasound2-dev pkg-config
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install -y libudev-dev libsystemd-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Install Just
        run: cargo install just

      - name: Build and Test
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo check --workspace --all-targets --message-format=short
          cargo test -p uncore --lib -- --skip ghost_setfinder --test-threads=4

      - name: Complete Job
        run: echo "Development workflow completed"
