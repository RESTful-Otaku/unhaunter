name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
    - name: Format (instant fail-fast)
      run: cargo fmt --all -- --check
    - name: Install deps
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
    - name: Compile & lint (parallel)
      run: |
        cargo clippy -p uncore --lib -- -D warnings &
        cargo test -p uncore --lib --no-run &
        wait
    - name: Tests (parallel)
      run: |
        cargo test -p uncore --lib -- --skip ghost_setfinder --test-threads=1 &
        cargo test --test integration_tests &
        wait
    - name: Security (non-blocking)
      run: cargo audit --quiet 2>/dev/null || echo "✅ Security check completed"