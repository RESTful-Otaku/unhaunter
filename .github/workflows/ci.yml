name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CI: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          pkg-config \
          libudev-dev \
          xvfb \
          pulseaudio
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Make scripts executable
      run: chmod +x scripts/*.sh
    
    - name: Check formatting
      run: |
        echo "::group::Code Formatting"
        cargo fmt --all -- --check
        echo "::endgroup::"
    
    - name: Run clippy on core
      run: |
        echo "::group::Clippy Lints (Core Library)"
        cargo clippy -p uncore --all-targets -- -D warnings
        echo "::endgroup::"
    
    - name: Start virtual audio/display
      run: |
        pulseaudio --start --exit-idle-time=-1
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
    
    - name: Run unit tests
      run: |
        echo "::group::Unit Tests (Core Library)"
        cargo test -p uncore --lib -- --skip ghost_setfinder --test-threads=1
        echo "::endgroup::"
      env:
        DISPLAY: :99
        PULSE_RUNTIME_PATH: /tmp/pulse-runtime
    
    - name: Run integration tests
      run: |
        echo "::group::Integration Tests"
        cargo test --test integration_tests
        echo "::endgroup::"
      env:
        DISPLAY: :99
        PULSE_RUNTIME_PATH: /tmp/pulse-runtime
    
    - name: Build core library
      run: |
        echo "::group::Build Core Library"
        cargo build -p uncore
        echo "::endgroup::"
      env:
        DISPLAY: :99
        PULSE_RUNTIME_PATH: /tmp/pulse-runtime
