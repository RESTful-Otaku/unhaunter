name: Production

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1

jobs:
  # Phase 1: Setup and Version Processing
  setup:
    name: Setup and Version Processing
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Setup job
        run: echo "Setting up the production environment"

      - name: Checkout code (tagged commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update APT
        run: sudo apt-get update

      - name: Install Linux Dependencies
        run: |
          sudo apt-get install -y build-essential
          sudo apt-get install -y libasound2-dev pkg-config
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install -y libudev-dev libsystemd-dev

      - name: Install Windows Cross-Compile Dependencies (mingw)
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install WASM Dependencies
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Install Just
        run: cargo install just

      - name: Get version from Tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          if [ -f "CHANGELOG.md" ]; then
            awk "/^## $VERSION$/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md > RELEASE_NOTES.md
          else
            echo "No CHANGELOG.md found, creating basic release notes" > RELEASE_NOTES.md
            echo "Release $VERSION" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "See commit history for changes." >> RELEASE_NOTES.md
          fi

  # Phase 2: Code Quality and Testing (runs in parallel with setup)
  quality-test:
    name: Code Quality and Testing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install -y -qq libudev-dev libsystemd-dev

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Compile check
        run: cargo check --workspace --all-targets --message-format=short

      - name: Build release binary
        run: cargo build --release --bin unhaunter_game

      - name: Unit tests - Core
        run: cargo test -p uncore --lib -- --skip ghost_setfinder --test-threads=4

      - name: Unit tests - All packages
        run: |
          for package in uncore unstd ungear ungearitems unmaphub untruck unplayer unghost unlight unmenu unnpc untmxmap unsettings unmenusettings unwalkie uncoremenu unmapload uncampaign unprofile unsummary unwalkie_types unwalkiecore unfog; do
            if [ -d "$package" ]; then
              echo "Running unit tests for $package..."
              cargo test -p $package --lib -- --test-threads=4 || true
            fi
          done

      - name: Integration tests
        run: cargo test --test integration_tests -- --test-threads=4

      - name: Simple integration tests
        run: cargo test --test simple_integration_tests -- --test-threads=4

      - name: End-to-End tests
        run: cargo test --test e2e_tests -- --test-threads=4

      - name: Game binary functionality test
        run: |
          cargo run --bin unhaunter_game -- --help
          cargo run --bin unhaunter_walkie_voice_generator -- --help || true

      - name: Performance tests
        run: cargo bench --no-run

  # Phase 3: Platform Builds (runs in parallel after setup)
  platform-builds:
    name: Platform Builds
    needs: setup
    strategy:
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows
            os: ubuntu-latest
            target: x86_64-pc-windows-gnu
          - platform: wasm
            os: ubuntu-latest
            target: wasm32-unknown-unknown
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install -y -qq libudev-dev libsystemd-dev

      - name: Install Windows cross-compile dependencies
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Install WASM dependencies
        if: matrix.platform == 'wasm'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack

      - name: Build release
        run: |
          if [ "${{ matrix.platform }}" = "wasm" ]; then
            wasm-pack build --target web --out-dir pkg --release
          else
            cargo build --release --target ${{ matrix.target }} --bin unhaunter_game
          fi

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: unhaunter-linux-production
          path: target/x86_64-unknown-linux-gnu/release/unhaunter_game

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: unhaunter-windows-production
          path: target/x86_64-pc-windows-gnu/release/unhaunter_game.exe

      - name: Upload WASM artifacts
        if: matrix.platform == 'wasm'
        uses: actions/upload-artifact@v4
        with:
          name: unhaunter-wasm-production
          path: pkg/

  # Phase 4: Mobile Builds (dedicated runners)
  mobile-builds:
    name: Mobile Builds
    needs: setup
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-${{ matrix.platform }}-

      - name: Install system dependencies (Android)
        if: matrix.platform == 'android'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install -y -qq libudev-dev libsystemd-dev

      - name: Setup Android (Android)
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk-version: 25.1.8937393

      - name: Install Android platforms explicitly (Android)
        if: matrix.platform == 'android'
        run: |
          echo "Installing Android platforms explicitly..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-30"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34"
          echo "Android platforms installed successfully"

      - name: Cache Android tools
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-android-tools-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-tools-

      - name: Install cargo-apk (Android)
        if: matrix.platform == 'android'
        run: |
          if ! command -v cargo-apk &> /dev/null; then
            cargo install cargo-apk
          else
            echo "cargo-apk already installed"
          fi

      - name: Add Android targets (Android)
        if: matrix.platform == 'android'
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Generate debug keystore (Android)
        if: matrix.platform == 'android'
        run: |
          echo "Generating debug keystore for Android signing..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "Debug keystore generated successfully"

      - name: Cache iOS tools
        if: matrix.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-ios-tools-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-tools-

      - name: Install cargo-xcode (iOS)
        if: matrix.platform == 'ios'
        run: |
          if ! command -v cargo-xcode &> /dev/null; then
            cargo install cargo-xcode
          else
            echo "cargo-xcode already installed"
          fi

      - name: Add iOS targets (iOS)
        if: matrix.platform == 'ios'
        run: |
          rustup target add aarch64-apple-ios
          rustup target add x86_64-apple-ios

      - name: Build Android APK
        if: matrix.platform == 'android'
        run: |
          set -e
          echo "Building Android APK..."
          cargo apk build --release --lib
          echo "Android build completed successfully"

      - name: Generate iOS Xcode project
        if: matrix.platform == 'ios'
        run: |
          set -e
          echo "Generating iOS Xcode project..."
          cargo xcode --platforms "iphoneos iphonesimulator"
          echo "iOS Xcode project generated successfully"

      - name: Upload Android artifacts
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: unhaunter-android-production
          path: target/android-artifacts/

      - name: Upload iOS artifacts
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: unhaunter-ios-production
          path: target/ios/

  # Phase 5: Release Creation (depends on all previous phases)
  release:
    name: Create GitHub Release
    needs: [setup, quality-test, platform-builds, mobile-builds]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release archives
        run: |
          mkdir -p dist
          if [ -d "unhaunter-linux-production" ]; then
            zip -r dist/unhaunter-linux.zip unhaunter-linux-production/
          fi
          if [ -d "unhaunter-windows-production" ]; then
            zip -r dist/unhaunter-windows.zip unhaunter-windows-production/
          fi
          if [ -d "unhaunter-wasm-production" ]; then
            zip -r dist/unhaunter-wasm.zip unhaunter-wasm-production/
          fi
          if [ -d "unhaunter-android-production" ]; then
            zip -r dist/unhaunter-android.zip unhaunter-android-production/
          fi
          if [ -d "unhaunter-ios-production" ]; then
            zip -r dist/unhaunter-ios.zip unhaunter-ios-production/
          fi

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.setup.outputs.version }}
          name: Release ${{ needs.setup.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip

  # Phase 6: Summary (depends on all previous phases)
  summary:
    name: Production Summary
    needs: [setup, quality-test, platform-builds, mobile-builds, release]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Production workflow completed"
          echo "Version: ${{ needs.setup.outputs.version }}"
          echo "Setup: ${{ needs.setup.result }}"
          echo "Quality & Test: ${{ needs.quality-test.result }}"
          echo "Platform Builds: ${{ needs.platform-builds.result }}"
          echo "Mobile Builds: ${{ needs.mobile-builds.result }}"
          echo "Release: ${{ needs.release.result }}"
