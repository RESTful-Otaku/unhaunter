name: Production

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup job
        run: echo "Setting up the production job environment"

      - name: Checkout code (tagged commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update APT
        run: sudo apt-get update

      - name: Install Linux Dependencies
        run: |
          sudo apt-get install -y build-essential
          sudo apt-get install -y libasound2-dev pkg-config
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install -y libudev-dev libsystemd-dev

      - name: Install Windows Cross-Compile Dependencies (mingw)
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install iOS cross-compile dependencies
        run: |
          # Note: iOS cross-compilation requires macOS runners
          echo "iOS cross-compilation will be handled in separate macOS job if needed"

      - name: Install Android cross-compile dependencies
        run: |
          # Android dependencies will be installed via android-actions/setup-android
          echo "Android dependencies will be installed via setup-android action"

      - name: Install WASM Dependencies
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Install Just
        run: cargo install just

      - name: Get version from Tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          if [ -f "CHANGELOG.md" ]; then
            awk "/^## $VERSION$/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md > RELEASE_NOTES.md
          else
            echo "No CHANGELOG.md found, creating basic release notes" > RELEASE_NOTES.md
            echo "Release $VERSION" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "See commit history for changes." >> RELEASE_NOTES.md
          fi

      - name: Build and Package Artifacts
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo check --workspace --all-targets --message-format=short
          cargo test -p uncore --lib -- --skip ghost_setfinder --test-threads=4
          cargo test --test integration_tests -- --test-threads=4
          cargo build --release --verbose
          just package

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            target/release/unhaunter_game

      - name: Post checkout code (tagged commit)
        run: echo "Release artifacts uploaded for version ${{ steps.get_version.outputs.VERSION }}"

      - name: Complete Job
        run: echo "Production workflow completed"
