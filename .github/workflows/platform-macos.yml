name: Platform - macOS

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run tests only (no build)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1

jobs:
  macos-build:
    name: macOS Build
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Compile check
        run: cargo check --workspace --all-targets --message-format=short

      - name: Unit tests
        if: ${{ !inputs.test_mode }}
        run: cargo test -p uncore --lib -- --skip ghost_setfinder --test-threads=4

      - name: Integration tests
        if: ${{ !inputs.test_mode }}
        run: cargo test --test integration_tests -- --test-threads=4

      - name: Build release
        if: ${{ !inputs.test_mode }}
        run: cargo build --release --bin unhaunter_game --message-format=short

      - name: Upload artifacts
        if: ${{ !inputs.test_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: unhaunter-macos
          path: target/release/unhaunter_game
